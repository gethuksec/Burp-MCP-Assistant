<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline';"
    />
    <link href="{{stylesUri}}" rel="stylesheet" />
    <title>Prompt Library</title>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="sidebar-header">
          <h2>Categories</h2>
        </div>
        <ul id="category-list">
          <li class="category-item active" data-category="all">All Prompts</li>
          <!-- Categories will be injected here -->
        </ul>
      </div>

      <div class="main-content">
        <div class="header">
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="search-input"
              placeholder="Search prompts..."
            />
          </div>
        </div>

        <div class="prompts-grid" id="prompts-grid">
          <!-- Prompts will be injected here -->
        </div>

        <div id="no-results" class="no-results" style="display: none">
          <p>No prompts found matching your search.</p>
        </div>
      </div>
    </div>

    <script>
      window.initialPrompts = {{promptsData}};
    </script>
    <script src="{{scriptUri}}"></script>
  </body>
</html>
